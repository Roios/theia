[project]
name = "theia"
version = "0.1.0"
description = "A simple perception project for the OAK-D"
readme = "README.md"
authors = [
    { name = "Roios", email = "pedro.roios@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "depthai>=3.9.0",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
theia = "theia:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
