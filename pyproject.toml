[project]
name = "theia"
version = "0.1.0"
description = "A simple perception project for the OAK-D"
readme = "README.md"
authors = [
    { name = "Roios", email = "pedro.roios@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "depthai>=3.9.0",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
display_streams = "theia.cli:display_streams"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14.5"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.29.0",
]
